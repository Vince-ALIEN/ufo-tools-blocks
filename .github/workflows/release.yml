# Publie une release GitHub avec le zip du plugin à chaque tag vX.Y.Z.
# L'updater du plugin (includes/class-ufo-tools-blocks-updater.php) installe cet
# asset ufo-tools-blocks.zip : build/ n'étant pas versionné, l'archive source de
# GitHub ne serait pas installable.
#
# Deux jobs : « build » exécute npm ci (scripts des dépendances) avec un jeton
# en lecture seule ; seul « publish », qui n'installe ni n'exécute rien du
# dépôt, reçoit le droit d'écrire pour créer la release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Tag = version du plugin
        run: |
          version=$(sed -n 's/^ \* Version: *//p' ufo-tools-blocks.php)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de ufo-tools-blocks.php"
            exit 1
          fi

      - name: Tests
        run: |
          npm ci
          npm test

      - name: Build et zip
        run: |
          npm run build
          npm run plugin-zip

      - name: Contrôle du zip
        run: |
          unzip -l ufo-tools-blocks.zip > files.txt
          grep -q ' ufo-tools-blocks/ufo-tools-blocks.php$' files.txt
          grep -q ' ufo-tools-blocks/uninstall.php$' files.txt
          grep -q ' ufo-tools-blocks/LICENSE.txt$' files.txt
          grep -q ' ufo-tools-blocks/includes/class-ufo-tools-blocks-updater.php$' files.txt
          grep -q ' ufo-tools-blocks/build/ufo-grid/block.json$' files.txt

      - name: Notes de version
        run: awk '/^## \[/{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ufo-tools-blocks.zip
            notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ufo-tools-blocks.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
