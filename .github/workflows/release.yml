# Publie une release GitHub avec le zip du plugin à chaque tag vX.Y.Z.
# L'updater du plugin (includes/class-ufo-tools-blocks-updater.php) installe cet
# asset ufo-tools-blocks.zip : build/ n'étant pas versionné, l'archive source de
# GitHub ne serait pas installable. ufo-tools-blocks-wporg.zip (sans updater) est
# la version à soumettre sur WordPress.org.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Tag = version du plugin
        run: |
          version=$(sed -n 's/^ \* Version: *//p' ufo-tools-blocks.php)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de ufo-tools-blocks.php"
            exit 1
          fi

      - name: Build et zip
        run: |
          npm ci
          npm run build
          npm run plugin-zip
          npm run plugin-zip:wporg

      - name: Contrôle du zip
        run: |
          unzip -l ufo-tools-blocks.zip > files.txt
          grep -q ' ufo-tools-blocks/ufo-tools-blocks.php$' files.txt
          grep -q ' ufo-tools-blocks/includes/class-ufo-tools-blocks-updater.php$' files.txt
          grep -q ' ufo-tools-blocks/build/ufo-grid/block.json$' files.txt
          grep -q ' ufo-tools-blocks/build/tailwind/blocks.css$' files.txt
          unzip -l ufo-tools-blocks-wporg.zip > wporg-files.txt
          grep -q ' ufo-tools-blocks/readme.txt$' wporg-files.txt
          if grep -q 'class-ufo-tools-blocks-updater.php' wporg-files.txt; then
            echo "::error::L'updater est présent dans ufo-tools-blocks-wporg.zip"
            exit 1
          fi

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## \[/{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "$GITHUB_REF_NAME" ufo-tools-blocks.zip ufo-tools-blocks-wporg.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
